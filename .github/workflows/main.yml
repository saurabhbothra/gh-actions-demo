name: Node.js CI/CD

on:
  workflow_dispatch:
  push:
    branches: [ ci-build ]
  pull_request:
    branches: [ ci-build ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3
    - name: Use Node.js 16
      uses: actions/setup-node@v3
      with:
        node-version: 16
        cache: 'npm'

    - run: npm install
    - run: npm test

